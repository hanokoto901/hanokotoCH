
name: Run build.py

on:
  schedule:
    - cron: '0 16 * * *'   # 毎日 1:00（日本時間）

  workflow_dispatch:

  repository_dispatch:
    types: [google_form_submit]

# 生成したページをコミットするための書き込み権限
permissions:
  contents: write

# フォーム送信が続いたときに同時実行でプッシュが衝突しないようにする
concurrency:
  group: build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      TZ: Asia/Tokyo          # 「最終更新」や「直近1週間」を日本時間で計算する
      PYTHONIOENCODING: utf-8

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run build.py
        id: build
        run: python build.py

      - name: Commit and push
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898201+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "変更なし"
            exit 0
          fi
          git commit -m "自動更新 $(date '+%Y/%m/%d %H:%M')"
          git pull --rebase
          git push

      - name: Notify Discord
        if: always()
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          BUILD_STATUS: ${{ steps.build.outcome }}
          COMMIT_STATUS: ${{ steps.commit.outcome }}
          EVENT_NAME: ${{ github.event_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ "$BUILD_STATUS" = "success" ] && [ "$COMMIT_STATUS" = "success" ]; then
            STATUS="✅ 更新完了"
          else
            STATUS="❌ 更新失敗"
          fi

          if [ "$EVENT_NAME" = "repository_dispatch" ]; then
            TRIGGER="Googleフォーム"
          elif [ "$EVENT_NAME" = "schedule" ]; then
            TRIGGER="定期実行"
          else
            TRIGGER="手動実行"
          fi

          MESSAGE=$(jq -n \
            --arg status "$STATUS" \
            --arg trigger "$TRIGGER" \
            --arg url "$RUN_URL" \
            '{content: ($status + "\n実行方法：" + $trigger + "\n詳細：" + $url)}')

          curl --fail-with-body -sS \
            -H "Content-Type: application/json" \
            -d "$MESSAGE" \
            "$DISCORD_WEBHOOK"
